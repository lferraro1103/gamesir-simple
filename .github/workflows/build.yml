name: Windows build and offline checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish portable app
        run: dotnet publish src/GameSirSimple/GameSirSimple.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o dist/GameSirSimple
      - name: Run offline visual and geometry checks
        shell: pwsh
        run: |
          $test = Start-Process -FilePath dist/GameSirSimple/GameSirSimple.exe -ArgumentList '--render-preview', 'artifacts/visual' -WindowStyle Hidden -Wait -PassThru
          Get-Content artifacts/visual/visual-check.txt
          if ($test.ExitCode -ne 0) { throw 'Offline checks failed' }
      - name: Include documentation and licenses
        shell: pwsh
        run: |
          Copy-Item LICENSE, README.md, README.es.md, README.zh-CN.md, CHANGELOG.md, THIRD_PARTY.md dist/GameSirSimple
          Copy-Item licenses dist/GameSirSimple/licenses -Recurse
          Copy-Item docs dist/GameSirSimple/docs -Recurse
      - uses: actions/upload-artifact@v4
        with:
          name: GameSirSimple-windows-x64
          path: dist/GameSirSimple
      - uses: actions/upload-artifact@v4
        with:
          name: offline-checks
          path: artifacts/visual
